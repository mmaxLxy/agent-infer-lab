[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-infer-lab"
version = "0.1.0"
description = "Reproducible experiments for Agent-oriented LLM inference infrastructure."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
agent-infer-env = "agent_infer_lab.environment:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_infer_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
