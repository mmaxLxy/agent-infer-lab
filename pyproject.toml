[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-infer-lab"
version = "0.1.0"
description = "Reproducible experiments for Agent-oriented LLM inference infrastructure."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
agent-infer-bench = "agent_infer_lab.benchmark:main"
agent-infer-env = "agent_infer_lab.environment:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_infer_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Report generators contain long Markdown templates and protocol strings whose
# source-line wrapping would make the emitted evidence harder to audit.
"scripts/awq_closed_loop/*.py" = ["E501"]
"scripts/fp8_closed_loop/*.py" = ["E501"]
"scripts/fp8_closed_loop/fp8_runtime.py" = ["E402", "E501"]
